[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chronophoto"
version = "0.2.0"
description = "Turn motion footage into layered action photographs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Max Seelig" }]
dependencies = [
  "av>=14.0.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "Pillow>=11.0.0",
  "PySide6>=6.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]
build = [
  "pyinstaller>=6.21.0,<7",
]

[project.scripts]
chronophoto = "chronophoto.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chronophoto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
