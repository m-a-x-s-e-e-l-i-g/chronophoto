name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: version
        name: Resolve version
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean chronophoto.spec
      - name: Smoke test frozen application
        run: .\dist\Chronophoto\Chronophoto.exe --version
      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\Chronophoto -DestinationPath release\Chronophoto-Windows-x64.zip
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ needs.metadata.outputs.version }}" packaging\windows\chronophoto.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Chronophoto-Windows-x64
          path: |
            release/Chronophoto-Windows-x64.zip
            release/Chronophoto-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean chronophoto.spec
      - name: Smoke test frozen application
        run: dist/Chronophoto.app/Contents/MacOS/Chronophoto --version
      - name: Package app and disk image
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent dist/Chronophoto.app "release/Chronophoto-macOS-${{ matrix.arch }}.zip"
          hdiutil create -volname Chronophoto -srcfolder dist/Chronophoto.app -ov -format UDZO "release/Chronophoto-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Chronophoto-macOS-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  linux:
    needs: metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux desktop runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install project and build tools
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean chronophoto.spec
      - name: Smoke test frozen application
        run: dist/Chronophoto/Chronophoto --version
      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/1024x1024/apps release
          cp -a dist/Chronophoto AppDir/usr/lib/chronophoto
          install -m 755 packaging/linux/AppRun AppDir/AppRun
          install -m 644 packaging/linux/chronophoto.desktop AppDir/chronophoto.desktop
          install -m 644 packaging/linux/chronophoto.desktop AppDir/usr/share/applications/chronophoto.desktop
          install -m 644 packaging/linux/chronophoto.png AppDir/chronophoto.png
          install -m 644 packaging/linux/chronophoto.png AppDir/usr/share/icons/hicolor/1024x1024/apps/chronophoto.png
      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          curl --fail --location --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run AppDir release/Chronophoto-Linux-x86_64.AppImage
          chmod +x release/Chronophoto-Linux-x86_64.AppImage
          release/Chronophoto-Linux-x86_64.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v4
        with:
          name: Chronophoto-Linux-x86_64
          path: release/Chronophoto-Linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [metadata, windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
